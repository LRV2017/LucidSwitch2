name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native Vulkan test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslc libsdl2-dev

      - name: Configure with the required Linux Vulkan pipeline
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUCID_REQUIRE_NATIVE_VULKAN=ON

      - name: Configure portable build
        if: runner.os != 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUCID_ENABLE_VULKAN=OFF -DLUCID_ENABLE_SDL2=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (including lavapipe native Vulkan rendering)
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          ctest --test-dir build -C Release --output-on-failure
        shell: bash

      - name: Run native Vulkan graphics demo
        if: runner.os == 'Linux'
        run: |
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          fi
          ./build/lucidswitch2 --gpu-info
          ./build/lucidswitch2 --graphics-demo --vulkan
        shell: bash

      - name: Run foundation self-test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/lucidswitch2.exe --self-test
          else
            ./build/lucidswitch2 --self-test
          fi
        shell: bash

      - name: Run bounded CPU demo
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/Release/lucidswitch2.exe --run
          else
            ./build/lucidswitch2 --run
          fi
        shell: bash

      - name: Create, inspect, and execute original LXP sample
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            LUCID_BIN="./build/Release/lucidswitch2.exe"
          else
            LUCID_BIN="./build/lucidswitch2"
          fi
          "$LUCID_BIN" --create-homebrew-sample build/register_demo.lxp
          "$LUCID_BIN" --inspect-homebrew build/register_demo.lxp
          RUN_OUTPUT=$("$LUCID_BIN" --run-homebrew build/register_demo.lxp 3)
          printf '%s\n' "$RUN_OUTPUT"
          printf '%s\n' "$RUN_OUTPUT" | grep -qi 'X0: 0x2a'
          printf '%s\n' "$RUN_OUTPUT" | grep -qi 'X1: 0xc0de'
        shell: bash
